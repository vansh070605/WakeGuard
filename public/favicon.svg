<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Sky-600 to Indigo-500) -->
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Rounded Rectangle Base (Matching the UI's rounded-xl logo container) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Shield Icon with AI Eye inside -->
  <g transform="translate(96, 96)">
    <!-- Shield Outline -->
    <path d="M 160 280 C 160 280 270 220 270 137 V 65 L 160 25 L 50 65 V 137 C 50 220 160 280 160 280 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Eye Shape representing AI Monitoring -->
    <path d="M 95 140 C 115 110 205 110 225 140 C 205 170 115 170 95 140 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Pupil -->
    <circle cx="160" cy="140" r="22" fill="#ffffff" />
  </g>
</svg>
